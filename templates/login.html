<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DevTrace AI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <i class="fas fa-microchip" style="color: var(--accent);"></i>
      DevTrace <span>AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link">Home</a></li>
      <li><a href="/register" class="btn btn-outline">Register</a></li>
    </ul>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access your Developer Identity Dashboard</p>
      </div>

      {% if error %}
        <div class="alert-error">
          <i class="fas fa-exclamation-triangle"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="developer@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" name="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <i class="fas fa-sign-in-alt"></i> Sign In to Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register">Create One</a></p>
      </div>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
